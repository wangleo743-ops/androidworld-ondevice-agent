name: Source checks and Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK (no emulator image)
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check sources for accidental private files
        run: python scripts/check_distribution.py
      - name: Offline tests
        run: python scripts/check.py
      - name: Compile Android Agent and Planner
        run: python run.py build
      - name: JVM protocol checks
        run: python scripts/check_java.py
